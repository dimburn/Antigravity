<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#12122a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  
  <!-- Subtle radial glow -->
  <circle cx="256" cy="240" r="180" fill="rgba(139, 92, 246, 0.06)"/>
  <circle cx="256" cy="240" r="120" fill="rgba(139, 92, 246, 0.04)"/>
  
  <!-- Spade symbol (large, centered) -->
  <g transform="translate(256, 210)" filter="url(#glow)">
    <!-- Spade body -->
    <path d="M0,-100 C-10,-90 -70,-40 -70,10 C-70,50 -40,75 0,55 C40,75 70,50 70,10 C70,-40 10,-90 0,-100 Z" 
          fill="url(#accent)" opacity="0.9"/>
    <!-- Spade stem -->
    <rect x="-8" y="45" width="16" height="40" rx="4" fill="url(#accent)" opacity="0.9"/>
    <!-- Spade base -->
    <ellipse cx="0" cy="85" rx="25" ry="8" fill="url(#accent)" opacity="0.7"/>
  </g>
  
  <!-- Belt (帯) across the spade -->
  <g filter="url(#glow)">
    <rect x="140" y="220" width="232" height="14" rx="7" fill="url(#gold)" opacity="0.85"/>
    <!-- Belt knot -->
    <circle cx="256" cy="227" r="11" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.9"/>
  </g>
  
  <!-- "GTO" Text -->
  <text x="256" y="360" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="52" font-weight="800" fill="url(#accent)" letter-spacing="8" filter="url(#glow)">
    GTO
  </text>
  
  <!-- "DOJO" Text -->
  <text x="256" y="405" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="32" font-weight="300" fill="rgba(232, 232, 240, 0.7)" letter-spacing="12">
    DOJO
  </text>
  
  <!-- Corner decorations -->
  <rect x="40" y="40" width="30" height="3" rx="1.5" fill="url(#accent)" opacity="0.3"/>
  <rect x="40" y="40" width="3" height="30" rx="1.5" fill="url(#accent)" opacity="0.3"/>
  <rect x="442" y="40" width="30" height="3" rx="1.5" fill="url(#accent)" opacity="0.3"/>
  <rect x="469" y="40" width="3" height="30" rx="1.5" fill="url(#accent)" opacity="0.3"/>
  <rect x="40" y="469" width="30" height="3" rx="1.5" fill="url(#accent)" opacity="0.3"/>
  <rect x="40" y="442" width="3" height="30" rx="1.5" fill="url(#accent)" opacity="0.3"/>
  <rect x="442" y="469" width="30" height="3" rx="1.5" fill="url(#accent)" opacity="0.3"/>
  <rect x="469" y="442" width="3" height="30" rx="1.5" fill="url(#accent)" opacity="0.3"/>
</svg>
